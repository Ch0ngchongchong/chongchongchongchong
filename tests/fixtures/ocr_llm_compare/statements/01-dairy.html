<!doctype html>
<!-- 01 유제품 (가상) — 데모와 같은 한 줄 형식. 규칙 방식이 유리한 기준선 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; color: #111; font-family: "Apple SD Gothic Neo", sans-serif; }
  .page { width: 820px; padding: 48px 40px; }
  h1 { font-size: 30px; text-align: center; letter-spacing: 12px; margin: 0 0 28px; }
  .meta { font-size: 17px; line-height: 1.7; margin-bottom: 24px; }
  .lines { font-size: 19px; line-height: 2.1; border-top: 2px solid #111; border-bottom: 2px solid #111; padding: 12px 0; }
  .total { font-size: 20px; font-weight: 700; margin-top: 16px; }
</style>
</head>
<body>
<div class="page">
  <h1>거래명세서</h1>
  <div class="meta">
    공급자: (가상) 한빛유업<br>
    사업자등록번호 123-45-67890<br>
    담당 김가상 010-0000-0000<br>
    작성일 2026-11-20
  </div>
  <div class="lines">
    서울우유 1000ml 2박스 × 26,500원 = 53,000원<br>
    생크림 1000ml 1박스 × 81,600원 = 81,600원<br>
    플레인 요거트 450g 3박스 × 25,600원 = 76,800원
  </div>
  <div class="total">합계: 211,400원</div>
</div>
</body>
</html>
